{%- comment -%}
  Signature motif: a stylized gecko seta — a stem that forks, and forks
  again, mimicking how gecko foot-hair bundles split into finer branches
  (setae -> spatulae). Used in the hero, as section dividers, and as the
  base for team-member avatars.

  Params:
    class  - extra CSS class on the <svg>
    stem   - "true" to include the base stem (default true)
{%- endcomment -%}
<svg class="branch-motif {{ include.class }}" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
  {%- unless include.stem == "false" -%}
  <path d="M50,97 L50,62"/>
  {%- endunless -%}
  <path d="M50,62 L32,42"/>
  <path d="M50,62 L68,42"/>
  <path d="M32,42 L20,24"/>
  <path d="M32,42 L40,23"/>
  <path d="M68,42 L60,23"/>
  <path d="M68,42 L80,24"/>
  <path d="M20,24 L14,9" stroke-width="1.6"/>
  <path d="M20,24 L26,8" stroke-width="1.6"/>
  <path d="M40,23 L36,7" stroke-width="1.6"/>
  <path d="M60,23 L64,7" stroke-width="1.6"/>
  <path d="M80,24 L74,8" stroke-width="1.6"/>
  <path d="M80,24 L86,9" stroke-width="1.6"/>
</svg>
